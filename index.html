<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#254b3b"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>세계 음식대백과 2.1</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#213a31;background:#fff9f1}*{box-sizing:border-box}body{margin:0}header{background:#254b3b;color:white;padding:16px 18px;position:sticky;top:0;z-index:2}header h1{font-size:23px;margin:0}header small{opacity:.85}.bar{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}button,select,input,textarea{font:inherit}button{border:0;border-radius:13px;padding:12px 15px;background:#e5efe7;color:#183f31;font-weight:700;cursor:pointer}button.primary{background:#e3b853;color:#172d22}button.danger{background:#ffe1df;color:#8b2925}select,input,textarea{padding:12px;border:1px solid #c8d6cb;border-radius:12px;background:white;max-width:100%}main{max-width:1100px;margin:auto;padding:16px}.intro{background:#fff;border:1px solid #e4dfcf;border-radius:17px;padding:15px;margin-bottom:16px}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.tools input{flex:1;min-width:150px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}.item{background:white;border:1px solid #e4e1d9;border-radius:16px;padding:15px;text-align:left;min-height:150px;box-shadow:0 3px 9px #00000008}.item strong{font-size:21px;display:block;margin-bottom:12px}.item p{font-size:14px;color:#4a5c53;line-height:1.55;margin:7px 0}.pill{font-size:13px;border-radius:20px;padding:5px 9px;display:inline-block;background:#f2f2f2}.white{background:#f1f1f1}.purple{background:#eee2ff;color:#6323a5}.green{background:#d9f3df;color:#145c2d}.gray{background:#e3e3e3;color:#555}dialog{border:0;border-radius:20px;padding:0;width:min(94vw,650px);max-height:88vh;box-shadow:0 15px 70px #0005}dialog::backdrop{background:#16281f99}.modal{padding:20px;overflow:auto;max-height:88vh}.modal h2{margin:0 0 12px}.modal label{display:block;font-weight:700;margin:14px 0 5px}.modal input,.modal textarea{width:100%}.modal textarea{min-height:105px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.photo{max-height:260px;width:100%;object-fit:contain;background:#f5f5f5;border-radius:12px}.note{font-size:13px;color:#5b675f;line-height:1.6}.err{color:#a52e2e}.muted{color:#67746d}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#234435;color:white;padding:11px 16px;border-radius:12px;display:none;z-index:10} @media(max-width:500px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.item{padding:11px}.item strong{font-size:18px}header h1{font-size:20px}}
</style></head><body><header><h1>🌍 세계 음식대백과 <small>2.1.0</small></h1><small>새로운 독립 엔진 · 기본 음식 자동 제공</small><div class="bar"><button onclick="openAdd()">＋ 음식 발견</button><button onclick="openManage()">💾 자료관리</button></div></header><main><div class="intro"><b id="headline">나라별 대표 음식을 준비하고 있습니다.</b><div class="note">⚪ 검색 전 · 🟣 미리보기 준비 · 🟢 완성 카드 · ⚫ 결과 없음. 기본 음식은 직접 입력할 필요가 없습니다.</div></div><div class="tools"><select id="country"></select><input id="filter" placeholder="음식 이름 검색"><span id="count" class="muted"></span></div><section class="grid" id="grid"></section></main>

<dialog id="editor"><div class="modal"><h2 id="editTitle">음식 추가</h2><label>음식 이름</label><input id="foodName"><label>음식 설명</label><textarea id="foodDesc"></textarea><label>사진 선택 (선택사항)</label><input type="file" id="foodPhoto" accept="image/*"><div class="note">선택한 사진은 압축하여 이 기기의 카드에 보관합니다.</div><div class="actions"><button class="primary" onclick="saveEdit()">저장</button><button onclick="closeDialog('editor')">취소</button></div></div></dialog>
